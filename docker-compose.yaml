services:
  mysql:
    ports:
      - "3306:3306"
    env_file:
      - .env
    image: mysql:8.0
    container_name: mosh-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
      - --innodb_buffer_pool_size=256M
      - --max_connections=60
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: always
    mem_limit: 450m

  redis:
    env_file:
      - .env
    image: redis:7-alpine
    container_name: mosh-redis
    command: ["redis-server", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 15
    restart: always
    mem_limit: 120m

  app:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mosh-app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}

      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRE_SECONDS: ${JWT_ACCESS_EXPIRE_SECONDS:-1800}
      JWT_REFRESH_EXPIRE_SECONDS: ${JWT_REFRESH_EXPIRE_SECONDS:-1209600}
      MOCK_LOGIN_SEED: ${MOCK_LOGIN_SEED:-earth-team}

      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx512m -XX:+UseG1GC -Dfile.encoding=UTF-8"

    ports:
      - "8080:8080"
    restart: always
    mem_limit: 600m

volumes:
  mysql_data:
