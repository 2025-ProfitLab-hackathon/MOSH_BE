spring:
  application:
    name: mosh_be

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/mosh?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  jpa:
    database: mysql
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false
    show-sql: false

  data:
    redis:
      host: localhost
      port: 6379
      password: root

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080

# JWT Settings
jwt:
  secret: ${JWT_SECRET:mosh-jwt-secret-key-for-hackathon-2025-profitlab-earth-team-4-please-change-in-production}
  expiration: 3600000 # 1 hour in milliseconds


# CORS Settings
cors:
  allowed-origins: http://localhost:3000,http://43.201.18.138:8080,https://your-vercel-app.vercel.app

# Logging
logging:
  level:
    root: INFO
    com.example.mosh_be: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Solar LLM API Settings
external:
  upstage:
    api-key: ${SOLAR_API_KEY}
